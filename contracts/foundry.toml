[profile.default]
src = "src"
out = "out"
libs = ["lib"]
# Воспроизводимая сборка (ревью 20.10, п. 6): каждый параметр, входящий в метаданные и байткод, задан ЯВНО, а не умолчанием
# версии forge. Значения — те, на которых собрана финальная редакция (`ba1d6abb`): байткод всех частей с ними не изменился
# (сверка sha deployedBytecode/bytecode до и после — README «Ревью 20.10»). Полное совпадение на Sourcify требует хеша
# метаданных в хвосте кода (`bytecode_hash = "ipfs"`, CBOR включён): Sourcify пересобирает по метаданным и сверяет и его.
# Ремаппинги входят в метаданные (и в хеш метаданных в хвосте кода): автоопределение по содержимому `lib/` выключено, список —
# явный и равен тому, что автоопределение давало на `0a818e3d` (ревью-2, п. 6: байткод всех частей с ним не изменился — README
# «Ревью-2 (21.10)»). Второго источника ремаппингов (`remappings.txt`) нет.
solc_version = "0.8.36"
evm_version = "cancun"
optimizer = true
optimizer_runs = 200
via_ir = false
bytecode_hash = "ipfs"
cbor_metadata = true
auto_detect_remappings = false
remappings = [
    "@hyper-evm-lib/=lib/hyper-evm-lib/",
    "@openzeppelin/contracts/=lib/hyper-evm-lib/lib/openzeppelin-contracts/contracts/",
    "erc4626-tests/=lib/hyper-evm-lib/lib/openzeppelin-contracts/lib/erc4626-tests/",
    "forge-std/=lib/forge-std/src/",
    "halmos-cheatcodes/=lib/hyper-evm-lib/lib/openzeppelin-contracts/lib/halmos-cheatcodes/src/",
    "hyper-evm-lib/=lib/hyper-evm-lib/src/",
    "hyper-evm-sim/=lib/hyper-evm-lib/test/simulation/",
    "openzeppelin-contracts/=lib/hyper-evm-lib/lib/openzeppelin-contracts/",
]
# стенды газа (`test/PoolLedgerGas.t.sol`) меряют сотни вызовов расчёта в одном тесте: их сумма больше 2^30 по умолчанию
gas_limit = 9223372036854775807

[rpc_endpoints]
hl_testnet = "https://rpc.hyperliquid-testnet.xyz/evm"
